# =============================================================================
# CortexOps NATS Server Configuration (Production)
# =============================================================================
# This config file is intended for production deployments where NKey-based
# authentication replaces the simple user/password scheme used in dev compose.
#
# To generate NKeys:
#   nk -gen user -pubout
#   nk -gen server -pubout
#
# Reference: https://docs.nats.io/running-a-nats-service/configuration/securing_nats/auth_intro/nkey_auth
# =============================================================================

port: 4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_mem: 1G
  max_file: 10G
}

authorization {
  # Each CortexOps service gets its own NKey identity.
  # Replace these placeholder public keys with real ones generated via `nk`.
  users: [
    {
      # collector service
      nkey: "UCOLLECTOR_NKEY_PUBLIC_KEY_HERE"
      permissions: {
        publish: {
          allow: ["cortex.telemetry.>", "cortex.topology.>"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
      }
    },
    {
      # correlator service
      nkey: "UCORRELATOR_NKEY_PUBLIC_KEY_HERE"
      permissions: {
        publish: {
          allow: ["cortex.incident.>"]
        }
        subscribe: {
          allow: ["cortex.telemetry.>", "cortex.topology.>", "_INBOX.>"]
        }
      }
    },
    {
      # rca service
      nkey: "URCA_NKEY_PUBLIC_KEY_HERE"
      permissions: {
        publish: {
          allow: ["cortex.rca.>"]
        }
        subscribe: {
          allow: ["cortex.incident.>", "_INBOX.>"]
        }
      }
    },
    {
      # remediation service
      nkey: "UREMEDIATION_NKEY_PUBLIC_KEY_HERE"
      permissions: {
        publish: {
          allow: ["cortex.remediation.>"]
        }
        subscribe: {
          allow: ["cortex.rca.>", "_INBOX.>"]
        }
      }
    }
  ]
}

# Logging
debug: false
trace: false
logtime: true
