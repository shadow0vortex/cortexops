# Production-grade defaults for CortexOps microservices
replicaCount: 2
clusterWideAccess: false

serviceMonitor:
  enabled: false

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

image:
  repository: docker.io/shadow0vortex/cortexops
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

diagnostics:
  existingSecret: cortexops-diag-token
  tokenKey: token

postgres:
  existingSecret: cortexops-postgres
  urlKey: url

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /v1
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: cortexops-api-tls

collector:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

correlator:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

topology:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 200m, memory: 1Gi }

rca:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 1000m, memory: 2Gi }

remediation:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

serviceAccount:
  # Per-service ServiceAccounts are created automatically (TD-040).
  # Only collector and remediation receive RBAC bindings.
  create: true

nats:
  enabled: true
  existingSecret: cortexops-nats-auth
  urlKey: url
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 20Gi
    merge:
      authorization:
        user: $NATS_USER
        password: $NATS_PASSWORD
  container:
    env:
      NATS_USER:
        valueFrom:
          secretKeyRef:
            name: cortexops-nats-auth
            key: username
      NATS_PASSWORD:
        valueFrom:
          secretKeyRef:
            name: cortexops-nats-auth
            key: password

postgresql:
  enabled: true
  architecture: standalone
  auth:
    username: cortex
    database: cortexops
    existingSecret: cortexops-postgres-auth
  primary:
    persistence:
      enabled: true
      size: 20Gi
    initdb:
      scripts:
        01-temporal-databases.sql: |
          CREATE DATABASE temporal OWNER cortex;
          CREATE DATABASE temporal_visibility OWNER cortex;

qdrant:
  enabled: true
  url: "http://cortexops-qdrant:6333"
  replicaCount: 1
  persistence:
    size: 20Gi

temporal:
  enabled: true
  host: "cortexops-temporal-frontend:7233"
  server:
    config:
      persistence:
        defaultStore: default
        visibilityStore: visibility
        numHistoryShards: 512
        datastores:
          default:
            sql:
              createDatabase: false
              manageSchema: true
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: cortexops-postgresql:5432
              connectProtocol: tcp
              user: cortex
              existingSecret: cortexops-postgres-auth
              secretKey: password
          visibility:
            sql:
              createDatabase: false
              manageSchema: true
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: cortexops-postgresql:5432
              connectProtocol: tcp
              user: cortex
              existingSecret: cortexops-postgres-auth
              secretKey: password

