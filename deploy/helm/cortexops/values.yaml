# Production-grade defaults for CortexOps microservices
replicaCount: 2

image:
  repository: cortexops
  pullPolicy: IfNotPresent
  tag: "latest"

collector:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

correlator:
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

topology:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 200m, memory: 1Gi }

rca:
  replicaCount: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 1000m, memory: 2Gi }

remediation:
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

serviceAccount:
  create: true
  name: "cortexops-sa"

nats:
  url: "nats://nats:4222"

temporal:
  host: "temporal:7233"

qdrant:
  url: "http://qdrant:6333"
