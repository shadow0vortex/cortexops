{{- $services := list "collector" "correlator" "topology" "rca" "remediation" -}}
{{- $k8sServices := list "collector" "remediation" -}}
{{- $roleKind := ternary "ClusterRole" "Role" .Values.clusterWideAccess -}}
{{- $bindingKind := ternary "ClusterRoleBinding" "RoleBinding" .Values.clusterWideAccess -}}

# =============================================================================
# Per-Service ServiceAccounts (TD-040)
# Only collector and remediation get RBAC bindings for K8s API access.
# =============================================================================
{{- range $service := $services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $service }}-sa
  labels:
    app: cortexops
    service: {{ $service }}
{{- end }}

# =============================================================================
# RBAC — Only for services that need Kubernetes API access
# =============================================================================
{{- if .Values.clusterWideAccess }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $roleKind }}
metadata:
  name: {{ .Release.Name }}-k8s-observe-role
rules:
- apiGroups: [""]
  resources: ["events", "pods", "services", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $roleKind }}
metadata:
  name: {{ .Release.Name }}-k8s-observe-role
rules:
- apiGroups: [""]
  resources: ["events", "pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
{{- end }}
{{- range $service := $k8sServices }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $bindingKind }}
metadata:
  name: {{ $.Release.Name }}-{{ $service }}-observe-binding
subjects:
- kind: ServiceAccount
  name: {{ $.Release.Name }}-{{ $service }}-sa
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: {{ $roleKind }}
  name: {{ $.Release.Name }}-k8s-observe-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.allowRemediationWrites }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $roleKind }}
metadata:
  name: {{ .Release.Name }}-k8s-remediation-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $bindingKind }}
metadata:
  name: {{ $.Release.Name }}-remediation-write-binding
subjects:
- kind: ServiceAccount
  name: {{ $.Release.Name }}-remediation-sa
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: {{ $roleKind }}
  name: {{ $.Release.Name }}-k8s-remediation-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
