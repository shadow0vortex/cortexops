{{- $services := list "collector" "correlator" "topology" "rca" "remediation" -}}
{{- range $service := $services }}
{{- $svcValues := index $.Values $service }}
{{- $imageTag := default $.Chart.AppVersion $.Values.image.tag }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $service }}
  labels:
    app: cortexops
    service: {{ $service }}
spec:
  replicas: {{ $svcValues.replicaCount | default $.Values.replicaCount }}
  selector:
    matchLabels:
      app: cortexops
      service: {{ $service }}
  template:
    metadata:
      labels:
        app: cortexops
        service: {{ $service }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $service }}-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cortexops
                    service: {{ $service }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ $service }}
          image: "{{ $.Values.image.repository }}-{{ $service }}:{{ $imageTag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if $.Values.securityContext }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.nats.existingSecret | quote }}
                  key: {{ $.Values.nats.urlKey | quote }}
            - name: TEMPORAL_URL
              value: {{ $.Values.temporal.host | quote }}
            - name: QDRANT_URL
              value: {{ $.Values.qdrant.url | quote }}
            - name: TOPOLOGY_URL
              value: "http://{{ $.Release.Name }}-topology:9091"
            {{- if eq $service "topology" }}
            - name: DIAG_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.diagnostics.existingSecret | quote }}
                  key: {{ $.Values.diagnostics.tokenKey | quote }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.existingSecret | quote }}
                  key: {{ $.Values.postgres.urlKey | quote }}
            {{- end }}
          resources:
            {{- toYaml $svcValues.resources | nindent 12 }}
          ports:
            - containerPort: 9091
              name: http
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /debug/healthz
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
