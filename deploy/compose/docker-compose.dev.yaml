version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    command: ["--js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortexpassword
      POSTGRES_DB: cortexops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortexops"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  temporal:
    image: temporalio/auto-setup:1.23.0
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=cortex
      - POSTGRES_PWD=cortexpassword
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
      - "8233:8233"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafanadata:/var/lib/grafana

  # ---------------------------------------------------------
  # Developer Tooling (Run via profiles/commands)
  # ---------------------------------------------------------
  proto-builder:
    build:
      context: ../../
      dockerfile: build/docker/proto.Dockerfile
    volumes:
      - ../../:/workspace
    working_dir: /workspace
    profiles:
      - tools

  go-builder:
    image: golang:1.22.4-bullseye
    volumes:
      - ../../:/workspace
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    working_dir: /workspace
    environment:
      - CGO_ENABLED=0
    profiles:
      - tools

  golangci-lint:
    image: golangci/golangci-lint:v1.55.2
    volumes:
      - ../../:/workspace
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    working_dir: /workspace
    profiles:
      - tools

volumes:
  pgdata:
  qdrantdata:
  promdata:
  grafanadata:
  gomodcache:
  gocache:
