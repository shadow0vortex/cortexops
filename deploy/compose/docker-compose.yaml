version: '3.8'

services:
  # NATS JetStream Message Broker
  nats:
    image: nats:2.10-alpine
    command: ["--js"]
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP Management port
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL for Incident State and OPA Policies
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortexpassword}
      POSTGRES_DB: ${POSTGRES_DB:-cortexops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortexops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database for AI Historical Memory
  qdrant:
    image: qdrant/qdrant:v1.8.0
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
