groups:
  - name: cortexops_health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      - alert: HighHealthScoreDegradation
        expr: cortexops_platform_health_score < 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CortexOps platform health is degraded"
          description: "Platform health score is {{ $value }}."

      - alert: CriticalHealthScoreDegradation
        expr: cortexops_platform_health_score < 0.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CortexOps platform health is critical"
          description: "Platform health score is {{ $value }}. Remediation may be blocked."
