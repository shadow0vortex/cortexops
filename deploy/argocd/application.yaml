apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cortexops
  namespace: argocd
  labels:
    app: cortexops
    managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/shadow0vortex/cortexops.git
    targetRevision: main
    path: deploy/helm/cortexops
    helm:
      releaseName: cortexops
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cortexops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
