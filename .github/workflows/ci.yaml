name: CortexOps CI Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: docker-compose --version

    - name: Fetch dependencies
      run: make deps

    - name: Run golangci-lint
      run: make lint

    - name: Run tests with race detector
      run: make race

    - name: Verify Protobuf Generation
      run: |
        make proto
        if [ -n "$(git status --porcelain api/)" ]; then
          echo "Protobuf generated files are out of sync. Please run 'make proto' and commit."
          exit 1
        fi

    - name: Build binaries
      run: make build

    - name: Run Govulncheck (Dependency Vulnerability Scanning)
      run: |
        docker compose -f deploy/compose/docker-compose.dev.yaml run --rm go-builder bash -c "go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./..."
