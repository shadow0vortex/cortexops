name: Release Automation

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Build binaries
      run: |
        mkdir -p dist
        for service in collector correlator topology rca remediation; do
          if [ -d "./cmd/$service" ]; then
            GOOS=linux GOARCH=amd64 go build -o dist/${service}-linux-amd64 ./cmd/$service
            GOOS=linux GOARCH=arm64 go build -o dist/${service}-linux-arm64 ./cmd/$service
          fi
        done

    - name: Generate Checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
