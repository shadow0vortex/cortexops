name: Release Automation

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # TD-021: Go version read from go.mod to eliminate toolchain mismatch.
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build release binaries
      run: |
        mkdir -p dist
        for service in collector correlator topology rca remediation; do
          if [ -d "./cmd/$service" ]; then
            echo "Building $service for linux/amd64..."
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -ldflags="-w -s -X main.version=${GITHUB_REF_NAME}" \
              -o dist/${service}-linux-amd64 ./cmd/$service

            echo "Building $service for linux/arm64..."
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
              -ldflags="-w -s -X main.version=${GITHUB_REF_NAME}" \
              -o dist/${service}-linux-arm64 ./cmd/$service
          fi
        done

    - name: Generate SHA256 checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        echo "--- Checksums ---"
        cat checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
