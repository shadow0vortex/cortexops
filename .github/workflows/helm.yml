name: Helm Validation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'

jobs:
  validate:
    name: Validate Helm Charts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0

    - name: Register chart repositories
      run: |
        helm repo add nats https://nats-io.github.io/k8s/helm/charts/
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add qdrant https://qdrant.github.io/qdrant-helm
        helm repo add temporal https://go.temporal.io/helm-charts
        helm repo update

    - name: Build chart dependencies
      run: helm dependency build deploy/helm/cortexops

    - name: Helm Lint
      run: helm lint deploy/helm/cortexops

    - name: Helm Template Production Configuration
      run: |
        rendered=$(helm template cortexops deploy/helm/cortexops \
          --set ingress.enabled=true \
          --set ingress.host=api.example.com \
          --set image.tag=ci-check)
        for service in collector correlator topology rca remediation; do
          echo "$rendered" | grep -Fq "docker.io/shadow0vortex/cortexops-${service}:ci-check"
        done
        echo "$rendered" | grep -Fq 'path: /v1'
