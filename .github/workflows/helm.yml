name: Helm Validation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'deploy/helm/**'
      - 'deploy/argocd/**'
      - '.github/workflows/helm.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deploy/helm/**'
      - 'deploy/argocd/**'
      - '.github/workflows/helm.yml'

jobs:
  validate:
    name: Validate Helm Charts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.0

    - name: Register chart repositories
      run: |
        helm repo add nats https://nats-io.github.io/k8s/helm/charts/
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add qdrant https://qdrant.github.io/qdrant-helm
        helm repo add temporal https://go.temporal.io/helm-charts
        helm repo update

    - name: Build chart dependencies
      run: helm dependency build deploy/helm/cortexops

    - name: Helm Lint
      run: helm lint deploy/helm/cortexops

    - name: Helm Template Production Configuration
      run: |
        set -euo pipefail
        rendered=$(helm template cortexops deploy/helm/cortexops \
          --set ingress.enabled=true \
          --set ingress.host=api.example.com \
          --set image.tag=ci-check)
        for service in collector correlator topology rca remediation; do
          echo "$rendered" | grep -Fq "docker.io/shadow0vortex/cortexops-${service}:ci-check"
        done
        echo "$rendered" | grep -Fq 'path: "/v1"'
        default_rbac=$(helm template cortexops deploy/helm/cortexops \
          --show-only templates/rbac.yaml)
        if echo "$default_rbac" | grep -Fq 'verbs: ["delete"]' || echo "$default_rbac" | grep -Fq 'verbs: ["patch"]'; then
          echo "Remediation write permissions must be opt-in" >&2
          exit 1
        fi

        cluster_read_only=$(helm template cortexops deploy/helm/cortexops \
          --show-only templates/rbac.yaml \
          --set clusterWideAccess=true)
        echo "$cluster_read_only" | grep -Fq 'kind: ClusterRole'
        echo "$cluster_read_only" | grep -Fq 'name: cortexops-k8s-observe-role'
        if echo "$cluster_read_only" | grep -Fq 'name: cortexops-k8s-remediation-role'; then
          echo "Read-only cluster access unexpectedly rendered a remediation role" >&2
          exit 1
        fi

        remediation_enabled=$(helm template cortexops deploy/helm/cortexops \
          --show-only templates/rbac.yaml \
          --set clusterWideAccess=true \
          --set allowRemediationWrites=true)
        echo "$remediation_enabled" | grep -Fq 'name: cortexops-k8s-remediation-role'
        echo "$remediation_enabled" | grep -Fq 'name: cortexops-remediation-write-binding'

        homelab_rbac=$(helm template cortexops deploy/helm/cortexops \
          --show-only templates/rbac.yaml \
          --values deploy/helm/cortexops/values-homelab.yaml)
        echo "$homelab_rbac" | grep -Fq 'kind: ClusterRole'
        if echo "$homelab_rbac" | grep -Fq 'name: cortexops-k8s-remediation-role'; then
          echo "Homelab profile must remain read-only" >&2
          exit 1
        fi

        homelab_deployments=$(helm template cortexops deploy/helm/cortexops \
          --show-only templates/deployment.yaml \
          --values deploy/helm/cortexops/values-homelab.yaml)
        deployment_count=$(echo "$homelab_deployments" | grep -c '^  replicas: 1$' || true)
        test "$deployment_count" -eq 5
        homelab_render=$(helm template cortexops deploy/helm/cortexops \
          --values deploy/helm/cortexops/values-homelab.yaml)
        if echo "$homelab_render" | grep -A6 'kind: HorizontalPodAutoscaler' \
          | grep -Eq 'name: cortexops-(collector|correlator|topology|rca|remediation)(-|$)'; then
          echo "Homelab profile must disable service autoscaling" >&2
          exit 1
        fi
