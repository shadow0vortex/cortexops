name: Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'build/docker/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'deploy/compose/**'
      - 'deploy/helm/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'build/docker/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'deploy/compose/**'
      - 'deploy/helm/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker.yml'

jobs:
  build-backend:
    name: Build Backend Service — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Build all services even if one fails, to surface all errors at once.
      fail-fast: false
      matrix:
        service: [collector, correlator, topology, rca, remediation]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-backend-${{ matrix.service }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-backend-${{ matrix.service }}-

    - name: Generate backend image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: docker.io/shadow0vortex/cortexops-${{ matrix.service }}
        tags: |
          type=sha,format=long
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    # All backend services share a single Dockerfile.base with SERVICE_NAME as a build arg.
    # This is the correct path — build/docker/Dockerfile.base (not deploy/docker/).
    - name: Build backend image (${{ matrix.service }})
      uses: docker/build-push-action@v6
      with:
        context: .
        file: build/docker/Dockerfile.base
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          SERVICE_NAME=${{ matrix.service }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache-frontend
        key: ${{ runner.os }}-buildx-frontend-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-frontend-

    # Keep the Vercel-hosted frontend build as validation only; it is not published here.
    - name: Build frontend image
      uses: docker/build-push-action@v6
      with:
        context: frontend
        file: frontend/Dockerfile
        push: false
        tags: cortexops/frontend:ci-${{ github.sha }}
        cache-from: type=local,src=/tmp/.buildx-cache-frontend
        cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache-frontend
        mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend || true
