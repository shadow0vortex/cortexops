name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/backend.yml'

jobs:
  validate:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Verify dependencies
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum || (echo "Dependencies out of sync. Please run 'go mod tidy' and commit." && exit 1)

    - name: Run Go vet
      run: go vet ./...

    - name: Lint Go code
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.55.2

    - name: Build binaries
      run: |
        mkdir -p bin
        for service in collector correlator topology rca remediation; do
          if [ -d "./cmd/$service" ]; then
            go build -o bin/$service ./cmd/$service
          fi
        done

    - name: Run tests
      env:
        CGO_ENABLED: 1
      run: go test -v -race ./...
